<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VITAL Commercial – Vita</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
<style>
:root {
  --accent: #c084fc;
}
.avatar-sm.ai {
  background: linear-gradient(135deg, #a855f7, #7c3aed);
}
.send-btn {
  background: var(--accent);
}
.send-btn:hover:not(:disabled) {
  background: #a855f7;
}
.product-badge, .product-context-bar, .quick-chips, .mode-badge {
  display: none !important;
}
</style>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>
</div>

<div class="app">
  <aside class="avatar-panel">
    <div class="avatar-scene">
      <div class="speak-ring r1"></div>
      <div class="speak-ring r2"></div>
      <div class="speak-ring r3"></div>
      <div class="avatar-glow"></div>
      <div id="avatarDiv"></div>
      <div id="avatar-loading">
        <div class="spin"></div>
        <span>Loading avatar…</span>
      </div>
    </div>
    <div class="agent-info">
      <div class="agent-name">Vita</div>
      <div class="agent-role">Pharmaceutical Delegate</div>
      <div class="agent-status">
        <div class="status-dot loading" id="status-dot"></div>
        <span id="status-text">Loading…</span>
      </div>
    </div>
    <div class="voice-controls">
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm0 2a2 2 0 0 0-2 2v6a2 2 0 0 0 4 0V5a2 2 0 0 0-2-2zm-7 8h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.92V20h3v2H8v-2h3v-2.08A7 7 0 0 1 5 11z"/></svg>
        <span id="mic-label">Hold to speak</span>
      </button>
      <div class="waveform" id="waveform">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      </div>
      <div class="stats-mini">
        <span>Products</span><span id="chunk-count">—</span>
      </div>
    </div>
  </aside>

  <main class="chat-panel">
    <div class="chat-header">
      <div class="header-left">
        <h1>VITAL Commercial Visit</h1>
        <p>You are the doctor. Vita is your delegate.</p>
      </div>
      <div class="header-right">
        <button class="report-btn" id="report-btn" onclick="openReport()" disabled title="Generate session report">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Report
        </button>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
          <rect width="44" height="44" rx="12" fill="rgba(192,132,252,0.08)" stroke="rgba(192,132,252,0.2)" stroke-width="1"/>
          <path d="M22 12a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0 10c4.42 0 8 1.79 8 4v2H14v-2c0-2.21 3.58-4 8-4z" fill="#c084fc" opacity="0.7"/>
        </svg>
        <h2>Bonjour Docteur</h2>
        <p>Cliquez pour commencer la visite avec Vita.</p>
        <button class="pick-product-cta" onclick="startVisit()">Commencer la visite →</button>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="question-input" rows="1"
          placeholder="Type your question or objection as the doctor..."
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendQuestion()">
          <svg viewBox="0 0 20 20" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="10" y1="16" x2="10" y2="4"/><polyline points="5,9 10,4 15,9"/>
          </svg>
        </button>
      </div>
      <div class="input-hint"><kbd>Enter</kbd> send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> new line</div>
    </div>
  </main>
</div>

<script type="importmap">
{
  "imports": {
    "three":         "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>

<script type="module" src="js/avatar.js"></script>
<script type="module" src="js/commercial.js"></script>
</body>
</html>
